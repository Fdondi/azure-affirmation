<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Affirmations</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 600px;
            width: 100%;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2.5rem;
            font-weight: 300;
            letter-spacing: -1px;
        }

        .affirmation-display {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 15px;
            padding: 30px;
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(102, 126, 234, 0.2);
            transition: all 0.3s ease;
        }

        .affirmation-text {
            font-size: 1.3rem;
            line-height: 1.6;
            color: #555;
            font-style: italic;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.5s ease;
        }

        .affirmation-text.show {
            opacity: 1;
            transform: translateY(0);
        }

        .placeholder-text {
            color: #999;
            font-size: 1.1rem;
        }

        .get-affirmation-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.1rem;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 500;
            letter-spacing: 0.5px;
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
            position: relative;
            overflow: hidden;
        }

        .get-affirmation-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(102, 126, 234, 0.4);
        }

        .get-affirmation-btn:active {
            transform: translateY(0);
        }

        .get-affirmation-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .loading {
            display: none;
            margin: 20px 0;
        }

        .loading.show {
            display: block;
        }

        .spinner {
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            border: 1px solid rgba(231, 76, 60, 0.3);
            border-radius: 10px;
            padding: 15px;
            margin: 20px 0;
            display: none;
        }

        .error-message.show {
            display: block;
        }

        .footer {
            margin-top: 30px;
            color: #777;
            font-size: 0.9rem;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                margin: 10px;
            }

            h1 {
                font-size: 2rem;
            }

            .affirmation-text {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Daily Affirmations</h1>
        
        <div class="affirmation-display">
            <div class="affirmation-text placeholder-text" id="affirmationText">
                Click the button below to get your daily affirmation ✨
            </div>
        </div>

        <div class="loading" id="loadingSpinner">
            <div class="spinner"></div>
            <p>Getting your affirmation...</p>
        </div>

        <div class="error-message" id="errorMessage">
            <strong>Oops!</strong> Something went wrong. Please try again.
        </div>

        <button class="get-affirmation-btn" id="getAffirmationBtn" onclick="getAffirmation()">
            Get Affirmation
        </button>

        <div class="footer">
            <p>Powered by Azure Functions</p>
        </div>
    </div>

    <script>
        // Configuration - Azure Static Web Apps automatically maps /api/* to your functions
        const AZURE_FUNCTION_URL = window.location.hostname === 'localhost' 
            ? 'http://localhost:7071/api/getRandomLine'  // Local development
            : '/api/getRandomLine';  // Production (Azure Static Web Apps)

        async function getAffirmation() {
            const btn = document.getElementById('getAffirmationBtn');
            const affirmationText = document.getElementById('affirmationText');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const errorMessage = document.getElementById('errorMessage');

            // Reset UI
            btn.disabled = true;
            affirmationText.classList.remove('show');
            loadingSpinner.classList.add('show');
            errorMessage.classList.remove('show');

            try {
                // Add a small delay to show loading animation
                await new Promise(resolve => setTimeout(resolve, 300));

                const response = await fetch(AZURE_FUNCTION_URL, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Hide loading
                loadingSpinner.classList.remove('show');

                // Display the affirmation
                if (data.line) {
                    affirmationText.textContent = `"${data.line}"`;
                    affirmationText.classList.remove('placeholder-text');
                } else {
                    throw new Error('No affirmation received');
                }

                // Show the text with animation
                setTimeout(() => {
                    affirmationText.classList.add('show');
                }, 100);

            } catch (error) {
                console.error('Error fetching affirmation:', error);
                
                // Hide loading
                loadingSpinner.classList.remove('show');
                
                // Show error
                errorMessage.innerHTML = `
                    <strong>Oops!</strong> 
                    ${error.message.includes('Failed to fetch') 
                        ? 'Unable to connect to the server. Make sure your Azure Function is running.' 
                        : 'Something went wrong. Please try again.'}
                `;
                errorMessage.classList.add('show');

                // Reset affirmation text
                affirmationText.textContent = 'Click the button below to get your daily affirmation ✨';
                affirmationText.classList.add('placeholder-text');
                affirmationText.classList.add('show');
            } finally {
                btn.disabled = false;
            }
        }

        // Add keyboard support
        document.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' || event.key === ' ') {
                const btn = document.getElementById('getAffirmationBtn');
                if (!btn.disabled) {
                    event.preventDefault();
                    getAffirmation();
                }
            }
        });

        // Initial animation
        window.addEventListener('load', function() {
            document.getElementById('affirmationText').classList.add('show');
        });
    </script>
</body>
</html>
